<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PhantomGrid">
  <defs>
    <linearGradient id="pg-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161033"/>
      <stop offset="1" stop-color="#070a1a"/>
    </linearGradient>
    <linearGradient id="pg-grid" x1="14" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c79bff"/>
      <stop offset="0.45" stop-color="#b072ff"/>
      <stop offset="0.7" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#3a3f70"/>
    </linearGradient>
    <linearGradient id="pg-node" x1="14" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9bcff"/>
      <stop offset="0.5" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#3a3f70"/>
    </linearGradient>
    <radialGradient id="pg-glow" cx="33" cy="33" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b072ff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#b072ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b072ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pg-tile)" stroke="#b072ff" stroke-opacity="0.3"/>

  <g transform="translate(13 13) scale(0.594)">
    <g stroke="url(#pg-grid)" stroke-width="1.6" stroke-linecap="round" opacity="0.5">
      <line x1="32" y1="32" x2="16" y2="16"/>
      <line x1="32" y1="32" x2="48" y2="16"/>
      <line x1="32" y1="32" x2="16" y2="48"/>
      <line x1="32" y1="32" x2="48" y2="48"/>
    </g>
    <g stroke="url(#pg-grid)" stroke-width="2.4" stroke-linecap="round">
      <line x1="16" y1="16" x2="48" y2="16"/>
      <line x1="16" y1="32" x2="48" y2="32"/>
      <line x1="16" y1="48" x2="48" y2="48"/>
      <line x1="16" y1="16" x2="16" y2="48"/>
      <line x1="32" y1="16" x2="32" y2="48"/>
      <line x1="48" y1="16" x2="48" y2="48"/>
    </g>
    <g fill="url(#pg-node)">
      <circle cx="16" cy="16" r="3"/>
      <circle cx="48" cy="16" r="2.8"/>
      <circle cx="16" cy="48" r="2.8"/>
      <circle cx="32" cy="16" r="2.2"/>
      <circle cx="16" cy="32" r="2.2"/>
      <circle cx="48" cy="32" r="2.2"/>
      <circle cx="32" cy="48" r="2.2"/>
    </g>
    <circle cx="48" cy="48" r="3.2" fill="none" stroke="#b072ff" stroke-width="1.6"
            stroke-dasharray="2.4 2.4" opacity="0.85"/>
  </g>

  <!-- Domain-controller hub (tile coordinates) -->
  <circle cx="33" cy="33" r="11" fill="url(#pg-glow)"/>
  <rect x="27" y="27" width="12" height="12" rx="1.3" transform="rotate(45 33 33)"
        fill="#070a1a" stroke="#b072ff" stroke-width="1.4"/>
  <circle cx="33" cy="33" r="2.3" fill="#b072ff"/>
</svg>
