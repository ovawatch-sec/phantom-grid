<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PhantomGrid">
  <defs>
    <!-- Trust-graph edges: lit violet at the top-left, dimming into shadow toward bottom-right. -->
    <linearGradient id="pg-grid" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c79bff"/>
      <stop offset="0.4" stop-color="#b072ff"/>
      <stop offset="0.7" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#33406e"/>
    </linearGradient>
    <linearGradient id="pg-node" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9bcff"/>
      <stop offset="0.5" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#34406a"/>
    </linearGradient>
    <radialGradient id="pg-glow" cx="32" cy="32" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b072ff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#b072ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b072ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Edges from the domain-controller hub to the principal nodes -->
  <g stroke="url(#pg-grid)" stroke-width="0.9" stroke-linecap="round" opacity="0.32">
    <line x1="32" y1="32" x2="16" y2="16"/>
    <line x1="32" y1="32" x2="48" y2="16"/>
    <line x1="32" y1="32" x2="16" y2="48"/>
    <line x1="32" y1="32" x2="48" y2="48"/>
  </g>
  <g stroke="url(#pg-grid)" stroke-width="2.1" stroke-linecap="round">
    <line x1="16" y1="16" x2="48" y2="16"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="16" y1="48" x2="48" y2="48"/>
    <line x1="16" y1="16" x2="16" y2="48"/>
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="48" y1="16" x2="48" y2="48"/>
  </g>

  <!-- Principal nodes -->
  <g fill="url(#pg-node)">
    <circle cx="16" cy="16" r="3.2"/>
    <circle cx="48" cy="16" r="2.8"/>
    <circle cx="16" cy="48" r="2.8"/>
    <circle cx="32" cy="16" r="2.4"/>
    <circle cx="16" cy="32" r="2.4"/>
    <circle cx="48" cy="32" r="2.2"/>
    <circle cx="32" cy="48" r="2.2"/>
  </g>
  <!-- The "phantom" node — a ghosted/dashed account (e.g. a shadow admin) -->
  <circle cx="48" cy="48" r="3" fill="none" stroke="#b072ff" stroke-width="1.3"
          stroke-dasharray="2 2" opacity="0.85"/>

  <!-- Domain-controller hub: glowing violet diamond + reticle ticks -->
  <circle cx="32" cy="32" r="12" fill="url(#pg-glow)"/>
  <rect x="25" y="25" width="14" height="14" rx="1.5" transform="rotate(45 32 32)"
        fill="#060c16" stroke="#b072ff" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.6" fill="#b072ff"/>
  <g stroke="#b072ff" stroke-width="1.4" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="19"/>
    <line x1="32" y1="42" x2="32" y2="45"/>
    <line x1="22" y1="32" x2="19" y2="32"/>
    <line x1="42" y1="32" x2="45" y2="32"/>
  </g>
</svg>
